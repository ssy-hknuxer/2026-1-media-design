<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 Booktrailer 1st Edit Tue</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #777;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 36px 28px 48px;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 24pt;
      line-height: 1.2;
      font-weight: 700;
      color: #777;
      letter-spacing: -0.02em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 28px 20px;
    }

    .item {
      display: block;
      text-decoration: none;
      color: inherit;
    }

    .thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      border: 1px solid #1a1a1a;
      border-radius: 2px;
      overflow: hidden;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      color: #555;
      font-size: 13px;
      line-height: 1.4;
      background: #111;
    }

    .caption {
      margin-top: 8px;
      font-size: 12pt;
      line-height: 1.45;
      font-weight: 400;
      color: #777;
      word-break: keep-all;
    }

    .student {
      font-weight: 700;
    }

    .book {
      font-weight: 400;
    }

    footer {
      margin-top: 48px;
      font-size: 10pt;
      color: #555;
      letter-spacing: 0.01em;
    }

    @media (max-width: 640px) {
      .page {
        padding: 28px 18px 40px;
      }

      h1 {
        font-size: 22px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .caption {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>2026 Booktrailer 1st Edit Tue</h1>
    <section class="grid" id="grid"></section>
    <footer>2026 HKNU Design | Media Design | Book Trailer</footer>
  </main>

  <script>
    const items = [
      { student: "강다영", book: "노르웨이의 숲", url: "https://www.youtube.com/watch?v=XSNCL5kejxA" },
      { student: "구도윤", book: "구운몽", url: "https://www.youtube.com/watch?v=GHTyL_HKYwU" },
      { student: "마도아", book: "첫사랑의 침공", url: "https://www.youtube.com/watch?v=A8YOA4lc6n4" },
      { student: "정세윤", book: "개구리가 되고 싶어", url: "https://www.youtube.com/watch?v=VfW9ckSW6HQ" },
      { student: "김보민", book: "동트기 힘든 긴 밤", url: "https://www.youtube.com/watch?v=7pe3ahsupDQ" },
      { student: "이승은25", book: "소년이 온다", url: "https://youtu.be/TE7144S--Qk?si=RxxD79bySdRxzsEv" },
      { student: "임가영", book: "넛지", url: "https://youtu.be/wBwTwhVzgiM" },
      { student: "임수현", book: "구의 증명", url: "https://youtu.be/c5oUzXzeZak" },
      { student: "조은서", book: "꿰맨 눈의 마을", url: "https://www.youtube.com/watch?v=GhoAf3hCOqk" },
      { student: "김주호", book: "악의 꽃", url: "https://youtu.be/IPZpydJakgQ?si=e8Ta2YkN92FzydPu" },
      { student: "김지민", book: "어린왕자", url: "https://youtu.be/MDR5MT-xo4E" },
      { student: "박수정", book: "동물농장", url: "https://www.youtube.com/watch?v=v_GFFl0FsUM" },
      { student: "윤수정", book: "종의 기원", url: "https://youtu.be/acfkHDAvZQE" },
      { student: "허윤선", book: "카지노", url: "" },
      { student: "김주하", book: "살인자의 기억법", url: "https://www.youtube.com/watch?v=atF1XhfPKFw" },
      { student: "박예빈", book: "아나하라트", url: "https://www.youtube.com/watch?v=yvvSeqqg5wQ" },
      { student: "윤은비", book: "이방인", url: "https://www.youtube.com/watch?v=ImeYMrt8ZdU" },
      { student: "정은희", book: "달러구트 꿈 백화점", url: "https://youtu.be/Sw0baWnyjIM" },
      { student: "최원준", book: "채식주의자", url: "https://youtu.be/s6F_et6yW9s" },
      { student: "김민영", book: "파과", url: "https://www.youtube.com/watch?v=XWFBbfMmeFI" },
      { student: "송아림", book: "미드나잇 라이브러리", url: "https://youtu.be/FazzKpIFmqI?si=lWI8FS-x1h1RIFhI" },
      { student: "정승희", book: "스노볼 드라이브", url: "https://youtu.be/oQQhqHWrb1k" },
      { student: "차송주", book: "나무", url: "https://www.youtube.com/watch?v=OPCezUEa8cE" },
      { student: "황예린", book: "연금술사(파울로 쿄엘로)", url: "https://www.youtube.com/watch?v=RDUZPLubplY" }
    ];

    function getYouTubeId(url) {
      if (!url) return null;

      const patterns = [
        /youtu\.be\/([^?&/]+)/,
        /youtube\.com\/watch\?v=([^?&/]+)/,
        /youtube\.com\/embed\/([^?&/]+)/,
        /youtube\.com\/shorts\/([^?&/]+)/
      ];

      for (const pattern of patterns) {
        const match = url.match(pattern);
        if (match && match[1]) return match[1];
      }

      return null;
    }

    function makeCaption(student, book) {
      return `
        <div class="caption">
          <span class="student">${student}</span> ·
          <span class="book">${book}</span>
        </div>
      `;
    }

    function renderItem(item) {
      const ytId = getYouTubeId(item.url);

      if (ytId) {
        return `
          <a class="item" href="${item.url}" target="_blank" rel="noopener noreferrer">
            <div class="thumb">
              <img src="https://img.youtube.com/vi/${ytId}/hqdefault.jpg" alt="${item.student} ${item.book} 유튜브 썸네일" />
            </div>
            ${makeCaption(item.student, item.book)}
          </a>
        `;
      }

      return `
        <div class="item">
          <div class="thumb">
            <div class="placeholder">No Link</div>
          </div>
          ${makeCaption(item.student, item.book)}
        </div>
      `;
    }

    document.getElementById("grid").innerHTML = items.map(renderItem).join("");
  </script>
</body>
</html>
