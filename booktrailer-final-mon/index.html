<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026-1-Book-Trailer-Monday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        /* 기본 스타일 설정 */
        body {
            background-color: #000000;
            color: #888888; /* 기본 글자 색상: 중명도 회색 */
            margin: 0;
            padding: 0;
            /* Arial, Helvetica 계열의 산세리프 Condensed 스타일 우선 지정 */
            font-family: 'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* 헤더: 왼쪽 정렬, 반응형 폰트 크기, 대소문자 유지 */
        header {
            max-width: 1400px;
            margin: 0 auto;
            padding: 6vw 20px 4vw 20px;
            text-align: left;
        }

        h1 {
            /* 화면 너비에 따라 글자 크기가 유동적으로 변함 (최소 24px, 최대 80px) */
            font-size: clamp(24px, 5.5vw, 80px);
            font-weight: bold;
            letter-spacing: -0.02em;
            margin: 0;
            white-space: nowrap; /* 한 줄로 표시 */
            color: #888888; /* 중명도 회색 */
        }

        /* 그리드 레이아웃 (반응형) */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 100px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 40px 24px;
        }

        .card {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            opacity: 0.6;
        }

        /* 썸네일 컨테이너 (1080x720 비율 지정) */
        .thumbnail-box {
            width: 100%;
            aspect-ratio: 1080 / 720; /* 3:2 비율 유지 */
            background-color: #111111; /* 이미지가 로드되기 전 배경색 */
            overflow: hidden;
            margin-bottom: 12px;
        }

        .thumbnail-box img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 비율에 맞게 꽉 채움 */
        }

        /* 학생명 및 도서명: 노토산스, 8포인트, 중명도 회색 */
        .info {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 8pt;
            color: #888888;
            letter-spacing: -0.2px;
            line-height: 1.5;
        }

        .info span.name::after {
            content: " | ";
            margin: 0 4px;
            opacity: 0.5;
        }

        /* 푸터 크레딧: 왼쪽 정렬 */
        footer {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px 80px 20px;
            text-align: left;
            border-top: 1px solid #222222;
            font-size: 8pt;
            color: #888888;
        }

        /* 모바일 최적화 화면 조정 */
        @media (max-width: 768px) {
            .container { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
        }
    </style>
</head>
<body>

<header>
    <h1>2026-1-Book-Trailer-Monday</h1>
</header>

<main class="container">
    <script>
        // 데이터 배열 (순서 유지)
        const data = [
            ["박희진", "1984 (조지 오웰)", "j-i6F3Ebl2g"],
            ["이리나", "노인과 바다", "XxzUZXuhY4Q"],
            ["정기호", "이기적 유전자", "HwHECDbsGXw"],
            ["최현지", "우리가 빛의 속도로 갈 수 없다면", "ko_QgC5NlZY"],
            ["홍지민", "미드나잇 라이브러리", "PqQI2sEZh4k"],
            ["강서연", "좀비 해방의 괴물", "3Q1i8nJ5R8c"],
            ["방준혁", "백야행", "mFSlQJKmr1U"],
            ["신아영", "지구 끝의 온실", "EKoZnvKJ7sQ"],
            ["양세빈", "변신", "25WfgrbdgIQ"],
            ["이준영", "어린왕자", "x54E5asv-64"],
            ["문지현", "모순(양귀자)", "0qFoU6-WsAU"],
            ["박주혜", "피라네시", "UggPg6CHNbs"],
            ["신예은", "달러구트 꿈 백화점", "_c0bZARwvaE"],
            ["이지수", "위대한 개츠비", "u9hai15a6FU"],
            ["최은서", "관계가 상처가 되기 전에", "fQiWyJI07H0"],
            ["김유나", "미드나잇 라이브러리", "UZK-rAAN48w"],
            ["박인애", "신곡", "qIw1PoFryOU"],
            ["이주원", "이방인", "vOtIs_af1qE"],
            ["이준수", "프랑켄슈타인", "We455buyDsc"],
            ["최호성", "호밀밭의 파수꾼", "ouZA1S1kXdQ"],
            ["김도현", "훔쳐라 아티스트처럼", "c86BCxK_hb4"],
            ["성지연", "브람스를 좋아하세요", "47fbv76hiso"],
            ["심재이", "살인자의 기억법", "aYfCe2BaDm0"],
            ["이서윤", "호밀밭의 파수꾼", "xSlhaWzpub8"],
            ["정찬우", "1984", "RDe3Wvvvy78"]
        ];

        const container = document.querySelector('.container');

        data.forEach(item => {
            const card = document.createElement('a');
            card.className = 'card';
            card.href = `https://youtu.be/${item[2]}`;
            card.target = '_blank';

            // 수정된 부분: 모든 이미지 소스를 필수적으로 존재하는 hqdefault.jpg로 변경
            card.innerHTML = `
                <div class="thumbnail-box">
                    <img src="https://img.youtube.com/vi/${item[2]}/hqdefault.jpg" alt="${item[1]}">
                </div>
                <div class="info">
                    <span class="name">${item[0]}</span>
                    <span class="book">${item[1]}</span>
                </div>
            `;
            container.appendChild(card);
        });
    </script>
</main>

<footer>
    2026 HKNU Design | Media Design | Book Trailer
</footer>

</body>
</html>
